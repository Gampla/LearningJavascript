<body>
    <p>Rock Paper Scissors</p>
    <button onclick="
        const randomBycomputer = Math.random();
        let computertake = ''
        if (randomBycomputer >= 0 && randomBycomputer < 1/3) {
            computertake = 'rock';
        } else if (randomBycomputer >= 1/3 && randomBycomputer < 2/3) {
            computertake = 'paper';
        } else if(randomBycomputer >= 2/3 && randomBycomputer < 3/3) {
            computertake = 'scissors';
        }
        let result = '';
        if(computertake === 'rock'){
            result = 'tie';
        }else if(computertake === 'paper'){
            result = 'lose';
        }else if(computertake === 'scissors'){
            result = 'wins';
        }
        alert(`yout pick rock and computer pick Result: ${result}`);
    ">ROCK</button>
