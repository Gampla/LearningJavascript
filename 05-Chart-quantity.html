<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Quantity</title>
</head>
<body>
    <button onclick="
        console.log(quantity)">Show Quantity</button>
    <button onclick="
    quantity++;
    console.log(`Total: ${quantity}`)">Add to Cart</button>
    <button onclick="
    quantity += 2;
    console.log(`Total: ${quantity}`)">+2</button>
    <button onclick="
    quantity += 3;
    console.log(`Total: ${quantity}`)">+3</button>
    <button onclick="
    quantity += 4;
    console.log(`Total: ${quantity}`)">+4</button>
    <button onclick="
    quantity += 5;
    console.log(`Total: ${quantity}`)">+5</button>
    <button onclick="
    quantity = 0;
    console.log(`Total: ${quantity}`)">Reset Cart</button>
    <button onclick="
    quantity--;
    console.log(`Total: ${quantity}`)">Remove From Chart</button>
    <button onclick="
    quantity -= 2;
    console.log(`Total: ${quantity}`)">-2</button>
    <button onclick="
    quantity -= 3;
    console.log(`Total: ${quantity}`)">-3</button>
</body>
<script>
   let quantity = 0;
</script>
</html>
