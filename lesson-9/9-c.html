<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>head and tails</title>
</head>
<body>
    <h1>Fliping Coin</h1>
    <button onclick="
      playGame('heads');
    ">heads</button>

    <button onclick="
      playGame('tails');
    ">tails</button>
    <button onclick="resetScore();">Reset Score</button>
    <p class="js-playerPick"></p>
</body>
<script>
      const score =  JSON.parse(localStorage.getItem('score')) || {
        win: 0,
        lose: 0
      };
      function resetScore() {
        score.win=0;
        score.lose=0;
        localStorage.removeItem('score');
        alert(`reset score successfully
        score : win ${score.win} lose ${score.lose}`);
      }

      function playGame(playerpick) {
       const computerPick = Math.random() < 0.5 ? 'heads' : 'tails';
       const result = playerpick === computerPick ? 'win' : 'lose';
        result === 'win' ? score.win++ : score.lose++;
        localStorage.setItem('score', JSON.stringify(score));
        document.querySelector('.js-playerPick').innerHTML=`You ${playerpick}`;
        alert(`You ${result}! Score: win ${score.win} lose ${score.lose}`);
        
      }
</script>
</html>
