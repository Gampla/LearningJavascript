<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Lesson</title>
</head>
<body>
    <button>9a</button>
    <button class="js-9b">9b</button>
    <input type="text" class="js-input" onkeydown="keyboardHandler(event)"><button onclick="displayName()">Submit</button>
    <p class="js-display"></p>
</body>
<script>
    function keyboardHandler(event) {
        if (event.key === 'Enter') {
            displayName();
        }
    }
    function displayName() {
    const inputData = document.querySelector('.js-input');
        document.querySelector('.js-display').innerHTML= `Your name is: ${inputData.value}`
    }
    const button = document.querySelector('button');
    console.log(button);
    document.querySelector('.js-9b').innerHTML='9b done';
    
</script>
</html>
