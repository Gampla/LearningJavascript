<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body{
            background-color: rgb(25, 25, 25);
            color: white;
            font-family: Arial;
        }
        .title{
            font-size: 30px;
            font-weight: bold;
        }
        .move-icon{
            height: 50px;
            background-color: none;
        }
        .move-button{
            background-color: rgb(25, 25, 25);
            border: 1px solid white;
            height: 100px;
            width: 100px;
            border-radius: 50px;
            padding: 10px;
        }
        .result{
            font-weight: bold;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <p class="title">Rock Paper Scissors</p>
    <button onclick="playerChoice('rock')" class="move-button"><img src="assets/rock.png" class="move-icon" alt=""></button>
    <button onclick="playerChoice('paper')" class="move-button"><img src="assets/paper.png" class="move-icon" alt=""></button>
    <button onclick="playerChoice('scissors')" class="move-button"><img src="assets/scissors.png" class="move-icon" alt=""></button>
    <p class="js-result result"></p>
    <p class="js-play"></p>
    <p class="js-score"></p>
    <button onclick="deleteScore()">Reset Score</button>
</body>

<script>
    let score = JSON.parse(localStorage.getItem('score')) || 
    {
        win: 0,
        lose: 0,
        tie: 0
    };
    updateScore();
    /*    
    if (score === null) { // this code is use to check if the score is null or not. if the score is null, it will create a new score object with win, lose, tie properties and set them to 0. if the score is not null, it will use the score from local storege.
        score ={
            win: 0,
            lose: 0,
            tie: 0 // this code is longcut for the code above, we can use the code above to make it more simple and clean. because the code above is use to check if the score is null or not, if the score is null, it will create a new score object with win, lose, tie properties and set them to 0. if the score is not null, it will use the score from local storege.
        }
    }*/

    function deleteScore(){
        score.win = 0;
        score.lose = 0;
        score.tie = 0;  
        localStorage.removeItem('score'); //untuk menghapus data local storage
        document.querySelector('.js-score').innerHTML = `Succesfully remove the score : win ${score.win} lose ${score.lose} tie ${score.tie}`;
    }
    function computerchoice(){
        const randomBycomputer = Math.random();
        let computertake = "" 
        if (randomBycomputer >= 0 && randomBycomputer < 1/3) {
            computertake = 'rock';
        } else if (randomBycomputer >= 1/3 && randomBycomputer < 2/3) {
            computertake = 'paper';
        } else if(randomBycomputer >= 2/3 && randomBycomputer < 3/3) {
            computertake = 'scissors';
        }
        return computertake;
    }

    function playerChoice(playerSelection){
        const computerSelectian = computertake = computerchoice();
        let result = '';
        if(computerSelectian === 'rock'){
            if(playerSelection === 'rock'){
                result = 'tie';
            }else if(playerSelection === 'paper'){
                result = 'wins';
            }else if(playerSelection === 'scissors'){
                result = 'lose';
            }
        }else if(computerSelectian === 'paper'){
            if(playerSelection === 'rock'){
                result = 'lose';
            }else if(playerSelection === 'paper'){
                result = 'tie';
            }else if(playerSelection === 'scissors'){
                result = 'wins';
            }
        }else if(computerSelectian === 'scissors'){
            if(playerSelection === 'rock'){
                result = 'wins';
            }else if(playerSelection === 'paper'){
                result = 'lose';
            }else if(playerSelection === 'scissors'){
                result = 'tie';
            }
        }
        if (result === 'wins'){
            score.win += 1 
        }else if(result === 'lose'){
            score.lose += 1 
        }else if(result === 'tie'){
            score.tie += 1
        }console.log(score);
        
        localStorage.setItem('score', JSON.stringify (score)); // This code is use to take the result in to local storege and concvert to string. because local storege only can save string data. and we use JSON.parse to convert the string back to object when we want to take the data from local storege.
        updateScore();
        document.querySelector('.js-result').innerHTML = `You ${result}`;
        document.querySelector('.js-play').innerHTML = `You <img src="assets/${playerSelection}.png" class="move-icon" alt=""><img src="assets/${computerSelectian}.png" class="move-icon" alt=""> Computer`;
    }
    function updateScore() {
        document.querySelector('.js-score').innerHTML = `score : win ${score.win} lose ${score.lose} tie ${score.tie}`;
    }
</script>

</html>
