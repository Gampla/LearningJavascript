<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Projects</title>
    <style>
        .subscribe-button{
            border: none;
            background-color: black;
            color: white;
            border-radius: 20px;
            padding: 10px 20px 10px 20px;
            font-weight: bold;   
        }

        .input-data{
            padding: 10px 20px 10px 20px;   
        }

        .button-calculate{
            padding: 10px 20px 10px 20px;
            margin-left: 5px;
            background-color: green;
            color: white;
            border: none;
        }

        .is-subscribe{
            background-color: grey;
            color: black;
        }


    </style>
</head>
<body>
    <p>YouTube Subscribe Button</p>
    <button class="js-subscribe subscribe-button" onclick="subscribeButton()">Subscribe</button>
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE Shiping</p>
    <input class="js-input input-data" placeholder="Cost of Order" onkeydown="keyboarHandler(event);
    "><button class="button-calculate" onclick="calculation()">Calculate</button>
    <p class="js-result"></p>
</body>
<script>
    function keyboarHandler(event) {
        if (event.key === 'Enter') {
            calculation();
        }
        
        
    }
    function calculation(){
        const inputData = document.querySelector('.js-input');
        let result = Number(inputData.value);
        if( result < 40 ){
            result += 10;
        } else{
            result;
        }
        document.querySelector('.js-result').innerHTML=`$${result}`;      
    }
    function subscribeButton() {
    let subsciberButton = document.querySelector('.js-subscribe');
    if (subsciberButton.innerHTML === 'Subscribe') {
        subsciberButton.innerHTML = 'Subscribed';
        subsciberButton.classList.add('is-subscribe');
    } else {
        subsciberButton.innerHTML = 'Subscribe';
        subsciberButton.classList.remove('is-subscribe')
    };    
    }

</script>
</html>
